steps:
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['install']

  - name: 'node:18'
    entrypoint: 'npm'
    args: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/appdelivery-repo/app:$COMMIT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/appdelivery-repo/app:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if gcloud run services describe appdelivery-service --region us-central1 >/dev/null 2>&1; then
          gcloud run deploy appdelivery-service \
            --image us-central1-docker.pkg.dev/$PROJECT_ID/appdelivery-repo/app:$COMMIT_SHA \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --no-traffic \
            --tag canary
          gcloud run services update-traffic appdelivery-service \
            --region us-central1 \
            --to-tags canary=10
        else
          gcloud run deploy appdelivery-service \
            --image us-central1-docker.pkg.dev/$PROJECT_ID/appdelivery-repo/app:$COMMIT_SHA \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
        fi

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/appdelivery-repo/app:$COMMIT_SHA'
